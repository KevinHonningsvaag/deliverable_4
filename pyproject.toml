[project]
name = "deliverable-4"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kevin", email = "kevhonn02@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "basedpyright>=1.40.2",
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]



[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", # PEP8 rules
    "F",               # undefined variables and imports
    "I",               # sorting of imports
    "B",               # bugs
    "UP",              # python syntax
    "SIM",             # simplifications
    "RUF",             # Ruff-spesific rules
]

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

